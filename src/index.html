<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: netpet:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>NetPet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titlebar">
    <div id="titlebar-drag">
      <span class="titlebar-app">NetPet</span>
      <span class="titlebar-sep">—</span>
      <span id="titlebar-name" class="titlebar-name">七夜</span>
    </div>
    <div id="titlebar-actions">
      <button id="collapse-btn" class="titlebar-btn" title="收起面板">◀</button>
      <button id="settings-btn" class="titlebar-btn" title="设置">⚙</button>
      <button id="min-btn" class="titlebar-btn" title="最小化">−</button>
      <button id="close-btn" class="titlebar-btn titlebar-close" title="关闭">×</button>
    </div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div id="image-area">
        <img id="pet-image" src="../assets/idle.png" alt="pet">
      </div>
      <div id="emotion-label">idle</div>
      <button id="expand-btn" title="展开面板">▶</button>
    </div>

    <div id="workspace">
      <div id="mode-tabs">
        <button class="mode-tab active" data-mode="chat">闲聊</button>
        <button class="mode-tab" data-mode="work">工作</button>
      </div>
      <div id="message-list"></div>
      <div id="terminal-panel" class="hidden">
        <div id="terminal-toolbar">
          <span class="terminal-label">终端输出</span>
          <div class="terminal-actions">
            <button id="terminal-copy-btn" title="复制">复制</button>
            <button id="terminal-expand-btn" title="展开">展开</button>
          </div>
        </div>
        <pre id="terminal-output"></pre>
      </div>
      <div id="input-area">
        <input id="drawer-input" type="text" placeholder="输入消息... (Enter 发送)">
        <button id="send-btn" title="发送">发送</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
