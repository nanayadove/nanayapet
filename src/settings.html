<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NetPet 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 20px;
      background: #f0f0f5;
      color: #333;
      width: 480px;
    }
    h2 { margin-bottom: 15px; font-size: 18px; }
    .group { margin-bottom: 12px; }
    .group label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
    .group input, .group select, .group textarea {
      width: 100%; padding: 8px; border: 1px solid #ccc;
      border-radius: 5px; font-size: 13px;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .group textarea { resize: vertical; }
    .model-row { display: flex; gap: 8px; }
    .model-row input { flex: 1; }
    .model-row button {
      white-space: nowrap; padding: 8px 12px;
      background: #4CAF50; color: white; border: none;
      border-radius: 5px; cursor: pointer;
    }
    .section-title {
      font-size: 14px; font-weight: bold; color: #555;
      margin: 18px 0 10px 0; padding-bottom: 4px;
      border-bottom: 1px solid #ddd;
    }
    .btns { display: flex; gap: 10px; margin-top: 15px; }
    .btns button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
    #btn-save { background: #4CAF50; color: white; }
    #btn-cancel { background: #ccc; color: #333; }
    #status { margin-top: 10px; font-size: 12px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <h2>⚙️ NetPet 设置</h2>

  <!-- ===== 对话 API ===== -->
  <div class="section-title">▸ 对话 API 配置</div>

  <div class="group">
    <label>服务商 (Provider)</label>
    <select id="sel-provider">
      <option>deepseek</option>
      <option>openai</option>
      <option>gemini</option>
      <option>custom_openai</option>
    </select>
  </div>

  <div class="group">
    <label>Base URL</label>
    <input id="inp-base-url" type="text" placeholder="https://api.deepseek.com/v1">
  </div>

  <div class="group">
    <label>API Key</label>
    <input id="inp-api-key" type="password" placeholder="sk-...">
  </div>

  <div class="group">
    <label>模型</label>
    <div class="model-row">
      <input id="inp-model" type="text" placeholder="deepseek-v4-flash">
      <button id="btn-fetch">获取列表</button>
    </div>
  </div>

  <div class="group">
    <label>温度 (Temperature)</label>
    <input id="inp-temperature" type="number" step="0.1" min="0" max="2" placeholder="0.7">
  </div>

  <!-- ===== 记忆 ===== -->
  <div class="section-title">▸ 记忆与总结配置</div>

  <div class="group">
    <label>后台总结服务商</label>
    <select id="sel-summary-provider">
      <option>同对话服务商</option>
      <option>deepseek</option>
      <option>openai</option>
      <option>gemini</option>
      <option>custom_openai</option>
    </select>
    <div style="font-size:11px;color:#999;margin-top:2px;">选"同对话"则不分开，选别的可以用便宜模型做总结</div>
  </div>

  <div class="group">
    <label>记忆总结间隔（轮）</label>
    <input id="inp-summary-interval" type="number" min="1" max="50" placeholder="5">
    <div style="font-size:11px;color:#999;margin-top:2px;">每 N 轮对话（1轮=你说一句+AI回一句）自动总结一次</div>
  </div>

  <div class="group">
    <label>最大历史长度（条）</label>
    <input id="inp-max-history" type="number" min="5" max="100" placeholder="10">
    <div style="font-size:11px;color:#999;margin-top:2px;">每次请求带上最近多少条对话</div>
  </div>

  <!-- ===== 工具系统 ===== -->
  <div class="section-title">▸ Agent 工具系统</div>
  <div style="font-size:11px;color:#999;margin-top:-8px;margin-bottom:10px;">
    启用后，桌宠可以调用工具（记笔记/设提醒等）。工具提取用便宜模型。
  </div>

  <div class="group">
    <label>工具提取服务商</label>
    <select id="sel-tool-provider">
      <option>同对话服务商</option>
      <option>deepseek</option>
      <option>openai</option>
      <option>gemini</option>
      <option>custom_openai</option>
    </select>
    <div style="font-size:11px;color:#999;margin-top:2px;">选"同对话"则工具提取复用对话模型，选别的可以用超便宜模型</div>
  </div>

  <div class="group">
    <label>工具提取模型（可选，留空则用对话模型）</label>
    <input id="inp-tool-model" type="text" placeholder="deepseek-v4-flash">
  </div>

  <!-- ===== 角色 ===== -->
  <div class="section-title">▸ 角色设定</div>

  <div class="group">
    <label>System Prompt</label>
    <textarea id="inp-prompt" rows="6"></textarea>
  </div>

  <div class="btns">
    <button id="btn-save">保存</button>
    <button id="btn-cancel">取消</button>
  </div>

  <div id="status"></div>

  <script src="settings.js"></script>
</body>
</html>
